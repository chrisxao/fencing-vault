[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sabre-ml"
version = "0.1.0"
description = "Stage-gated perception and temporal modeling for Sabre Studio"
requires-python = ">=3.11"
dependencies = [
  "av>=13,<16",
  "boto3>=1.35,<2",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers>=4.46,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
sabre-ml = "sabre_ml.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sabre_ml"]

[tool.ruff]
line-length = 110
target-version = "py311"
